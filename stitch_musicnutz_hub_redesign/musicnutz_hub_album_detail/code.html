        ];

        const container = document.getElementById('track-container');
        const emptyState = document.getElementById('empty-state');

        if (tracks.length === 0) {
            container.classList.add('hidden');
            emptyState.classList.remove('hidden');
        } else {
            tracks.forEach((track, index) => {
                const row = document.createElement('div');
                row.tabIndex = 0;
                row.className = "track-row group flex items-center justify-between p-3 h-[64px] transition-all cursor-pointer focus:outline-none";
                row.innerHTML = `
                    <div class="flex items-center gap-x-4 flex-1 truncate">
                        <div class="relative w-8 h-8 flex items-center justify-center">
                            <span class="text-on-surface-variant font-meta-xs group-hover:hidden group-focus:hidden">${index + 1}</span>

                        <span class="text-meta-xs font-meta-xs text-on-surface-variant w-12 text-right">${track.duration}</span>
                    </div>
                `;
                
                // Interaction simulation
                row.addEventListener('click', () => {
                    document.querySelectorAll('.track-row').forEach(r => r.classList.remove('bg-surface-variant'));
                    row.classList.add('bg-surface-variant');
                });
                
                container.appendChild(row);
            });
