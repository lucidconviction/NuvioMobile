  </head>
<body class="bg-[#000000] min-h-screen flex flex-col overflow-x-hidden">
<!-- TopNavBar (Simulated Sticky Header for Details Screen) -->
<header class="sticky top-0 z-50 bg-[#000000]/80 backdrop-blur-md flex items-center justify-between h-16 px-margin-mobile">
<button aria-label="Go back" class="p-2 -ml-2 rounded-full hover:bg-surface-variant transition-colors active:scale-90">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline-md text-body-md text-primary truncate max-w-[200px]">Quantum Resonance</h1>
<button aria-label="More options" class="p-2 -mr-2 rounded-full hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-primary">more_vert</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-margin-mobile pb-24">
<!-- Hero Section -->
<section class="flex flex-col items-center mt-6 text-center">
<div class="relative w-[200px] h-[200px] mb-8 group">
<div class="absolute inset-0 bg-white/5 rounded-xl blur-xl group-hover:blur-2xl transition-all duration-500"></div>
<img class="relative w-full h-full object-cover rounded-[16px] shadow-2xl border border-white/10 group-hover:scale-[1.02] transition-transform duration-500" data-alt="A futuristic and atmospheric album cover featuring complex monochromatic geometric patterns and glitch-art distortions in high-contrast black and white. The aesthetic is clean, sophisticated, and dark, evoking a high-fidelity audio engineering vibe with sleek chrome textures and deep obsidian shadows. Sharp lines and abstract digital structures suggest a quantum computing or advanced synthesis theme, perfectly aligned with a professional music hub aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDHL8tU46yHoC9Uh67HWsGNvxhjw-h85fxOyhIWux892YnS6zen0iojZLorJP7QQRJLXOn9UhhgfInUAwkAoGQRlOplokntRSwz-8n84zjG8NqumhxkpN8XU87-WyQRJ_OtsCK24eM-XQ-bjiAfe2wiJm4KpoF2qg9fKNsNeCbNp-Z-C4MAAvVhuuWi-2b-L2x-PYQ2m2CNuOQu88pDBGreAGVzztn69UhmuF9oORqOmPheIywYeqSG901svi8RuGvtfiXU13kWIjI"/>
</div>
<!-- Metadata -->
<div class="space-y-1">
<h2 class="text-[22px] font-bold text-primary tracking-tight">Quantum Resonance</h2>
<p class="text-[16px] font-medium text-[#B0B0B0]">Synthetic Echoes</p>
<div class="flex items-center justify-center space-x-2 text-[13px] text-[#888888] font-meta-sm">
<span>2024</span>
<span class="w-1 h-1 rounded-full bg-[#444748]"></span>
<span>12 Tracks</span>
</div>
</div>
<!-- Action Buttons -->
<div class="flex items-center space-x-4 mt-8 w-full">
<button class="flex-1 h-12 bg-primary text-[#000000] rounded-full font-bold flex items-center justify-center space-x-2 hover:opacity-90 active:scale-95 transition-all">
<span class="material-symbols-outlined fill-icon" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
<span>Play</span>
</button>
<button class="w-12 h-12 bg-[#1A1A1A] text-primary rounded-full flex items-center justify-center border border-[#888888]/20 hover:bg-surface-variant active:scale-90 transition-all">
<span class="material-symbols-outlined" id="like-btn">favorite</span>
</button>
<button class="w-12 h-12 bg-[#1A1A1A] text-primary rounded-full flex items-center justify-center border border-[#888888]/20 hover:bg-surface-variant active:scale-90 transition-all">
<span class="material-symbols-outlined">download</span>
</button>
</div>
</section>
<!-- Track List Section -->
<section class="mt-10 mb-10">
<div class="flex items-center justify-between mb-4">
<h3 class="text-meta-sm text-[#888888] uppercase tracking-widest">Tracklist</h3>
<button class="text-meta-sm text-primary font-bold">Shuffle</button>
</div>
<div class="space-y-1">
<!-- Track Items -->
<div class="flex flex-col" id="tracklist-container">
<!-- Tracks will be injected by JS or mapped manually below -->
</div>
</div>
</section>
</main>
<!-- Suppressed BottomNavBar (User task focused) but following "Canvas First" mandate for sub-pages -->
<!-- The prompt implies a detailed sub-page view, so global nav is suppressed per shell logic. -->
<script>
        const tracks = [
            { title: "Initial Singularity", artist: "Synthetic Echoes", duration: "03:45" },
            { title: "Phase Shift", artist: "Synthetic Echoes", duration: "04:12" },
            { title: "Binary Horizon", artist: "Synthetic Echoes", duration: "05:01" },
            { title: "Null Vector", artist: "Synthetic Echoes", duration: "03:58" },
            { title: "Entropy Cascade", artist: "Synthetic Echoes", duration: "04:33" },
            { title: "Static Pulse", artist: "Synthetic Echoes", duration: "02:15" },
            { title: "Vector Field", artist: "Synthetic Echoes", duration: "05:22" },
            { title: "Coherence Loss", artist: "Synthetic Echoes", duration: "04:10" },
            { title: "Dark Matter Drift", artist: "Synthetic Echoes", duration: "06:04" },
            { title: "Echo Chambers", artist: "Synthetic Echoes", duration: "03:47" },
            { title: "Signal Decay", artist: "Synthetic Echoes", duration: "04:21" },
            { title: "The Last Waveform", artist: "Synthetic Echoes", duration: "07:12" }
        ];

        const container = document.getElementById('tracklist-container');
        
        tracks.forEach((track, index) => {
            const trackEl = document.createElement('div');
            trackEl.className = 'flex items-center h-16 px-2 rounded-lg hover:bg-[#1A1A1A] transition-colors group cursor-pointer border-b border-white/5 last:border-0';
            trackEl.innerHTML = `
                <div class="w-8 flex-shrink-0 text-meta-xs text-[#888888] font-meta-sm group-hover:hidden">
                    ${index + 1}
                </div>
                <div class="w-8 flex-shrink-0 hidden group-hover:flex items-center">
                    <span class="material-symbols-outlined text-primary text-[20px]">play_arrow</span>
                </div>
                <div class="flex-1 min-w-0 pr-4">
                    <div class="text-[14px] font-semibold text-white truncate">${track.title}</div>
                    <div class="text-[11px] text-[#888888] font-medium">${track.artist}</div>
                </div>
                <div class="text-[11px] text-[#888888] font-meta-sm font-normal">
                    ${track.duration}
                </div>
                <button class="ml-4 p-2 opacity-0 group-hover:opacity-100 transition-opacity">
                    <span class="material-symbols-outlined text-[18px] text-[#888888]">more_horiz</span>
                </button>
            `;
            container.appendChild(trackEl);
        });

        // Simple Toggle Interaction for Like Button
        const likeBtn = document.getElementById('like-btn');
        likeBtn.parentElement.addEventListener('click', () => {
            const isLiked = likeBtn.classList.contains('fill-icon');
            if (isLiked) {
                likeBtn.classList.remove('fill-icon');
                likeBtn.style.fontVariationSettings = "'FILL' 0";
                likeBtn.style.color = "";
            } else {
                likeBtn.classList.add('fill-icon');
                likeBtn.style.fontVariationSettings = "'FILL' 1";
                likeBtn.style.color = "white";
            }
        });

        // Handle scroll behavior for header title appearance
        window.addEventListener('scroll', () => {
            const scrollPos = window.scrollY;
            const header = document.querySelector('header');
            if (scrollPos > 100) {
                header.classList.add('border-b', 'border-white/10');
            } else {
                header.classList.remove('border-b', 'border-white/10');
            }
        });
    </script>
</body></html>
